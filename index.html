<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퀴즈런 — 하루 한 문제 퀴즈</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
    background: linear-gradient(135deg, #e8f0fe 0%, #cfe2ff 50%, #f6e9f2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .container {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    width: 100%;
    max-width: 480px;
    padding: 28px 24px 32px;
    position: relative;
    overflow: hidden;
  }

  .container::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, #6366f1, #ec4899, #f59e0b);
  }

  /* 상단 헤더 */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.15rem;
    font-weight: 700;
    color: #1e293b;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    font-weight: 800;
  }

  .stats {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .stat-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #f1f5f9;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 0.82rem;
    color: #475569;
    font-weight: 600;
  }

  .rank-badge {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  /* 문제 카드 */
  .question-card {
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
    position: relative;
  }

  .question-number {
    font-size: 0.75rem;
    color: #94a3b8;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .question-text {
    font-size: 1.05rem;
    color: #0f172a;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 18px;
  }

  /* 보기 버튼 */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 16px;
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 0.98rem;
    color: #1e293b;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }

  .option-btn:hover:not(:disabled) {
    border-color: #818cf8;
    background: #eef2ff;
  }

  .option-btn.selected {
    border-color: #6366f1;
    background: #eef2ff;
    font-weight: 600;
  }

  .option-btn.correct {
    border-color: #22c55e;
    background: #f0fdf4;
    color: #166534;
    font-weight: 600;
  }

  .option-btn.wrong {
    border-color: #ef4444;
    background: #fef2f2;
    color: #991b1b;
  }

  .option-btn:disabled {
    cursor: default;
    opacity: 0.9;
  }

  .option-letter {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    color: #475569;
    flex-shrink: 0;
  }

  .option-btn.correct .option-letter {
    background: #22c55e;
    color: #fff;
  }

  .option-btn.wrong .option-letter {
    background: #ef4444;
    color: #fff;
  }

  /* 결과 영역 */
  .result-area {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 2px solid #e2e8f0;
    display: none;
  }

  .result-area.visible {
    display: block;
  }

  .result-main {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .result-icon {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .result-icon.correct {
    background: #f0fdf4;
    color: #22c55e;
  }

  .result-icon.wrong {
    background: #fef2f2;
    color: #ef4444;
  }

  .result-text {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.4;
  }

  .result-text.correct { color: #166534; }
  .result-text.wrong { color: #991b1b; }

  .explanation {
    background: #fefce8;
    border-left: 4px solid #f59e0b;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.88rem;
    color: #713f12;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .explanation-label {
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #a16207;
    margin-bottom: 4px;
  }

  .action-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn-primary {
    flex: 1;
    padding: 13px 16px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(99,102,241,0.4);
  }

  .btn-secondary {
    padding: 13px 16px;
    background: #f1f5f9;
    color: #475569;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-secondary:hover {
    background: #e2e8f0;
  }

  .footer-note {
    margin-top: 20px;
    text-align: center;
    font-size: 0.75rem;
    color: #94a3b8;
  }

  .new-day-banner {
    background: #fef9c3;
    border: 1px solid #fde68a;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 16px;
    font-size: 0.82rem;
    color: #854d0e;
    text-align: center;
    display: none;
  }

  .new-day-banner.visible {
    display: block;
  }

  .new-day-banner strong {
    color: #a16207;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">Q</div>
        <span>퀴즈런</span>
      </div>
      <div class="stats">
        <span class="stat-badge" id="streakBadge">🔥 <span id="streakCount">0</span></span>
        <span class="rank-badge" id="rankBadge">브론즈</span>
      </div>
    </div>

    <div class="new-day-banner" id="newDayBanner">
      🎉 <strong>새로운 문제</strong>가 도착했어요! 오늘 도전해 보세요.
    </div>

    <div class="question-card">
      <div class="question-number" id="questionNumber">QUESTION 01</div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsContainer"></div>
    </div>

    <div class="result-area" id="resultArea">
      <div class="result-main">
        <div class="result-icon" id="resultIcon"></div>
        <div class="result-text" id="resultText"></div>
      </div>
      <div class="explanation" id="explanationBox">
        <div class="explanation-label">💡 해설</div>
        <div id="explanationText"></div>
      </div>
      <div class="action-buttons">
        <button class="btn-primary" id="nextBtn">다음 문제 풀기</button>
        <button class="btn-secondary" id="resetBtn">기록 초기화</button>
      </div>
    </div>

    <div class="footer-note">
      퀴즈가 즐거웠다면 친구에게 공유해 보세요 📤
    </div>
  </div>

<script>
(function() {
  "use strict";

  // ---- 문제 데이터베이스 ----
  const questions = [
    {
      question: "태양계에서 가장 큰 행성은 무엇일까요?",
      options: ["지구", "목성", "토성", "화성"],
      answer: 1,
      explanation: "목성은 태양계에서 가장 큰 행성으로, 지름이 지구의 약 11배입니다."
    },
    {
      question: "물(H₂O)의 화학적 구성은?",
      options: ["수소 1개 + 산소 1개", "수소 2개 + 산소 1개", "수소 1개 + 산소 2개", "수소 2개 + 산소 2개"],
      answer: 1,
      explanation: "물 분자는 수소 원자 2개와 산소 원자 1개로 이루어져 있습니다(H₂O)."
    },
    {
      question: "대한민국에서 가장 큰 섬은 어디일까요?",
      options: ["거제도", "제주도", "진도", "강화도"],
      answer: 1,
      explanation: "제주도는 대한민국에서 가장 큰 섬으로, 면적은 약 1,833km²입니다."
    },
    {
      question: "세계에서 가장 높은 산은?",
      options: ["K2", "에베레스트", "킬리만자로", "후지산"],
      answer: 1,
      explanation: "에베레스트 산의 높이는 약 8,848m로 세계 최고봉입니다."
    },
    {
      question: "광합성으로 식물이 만들어내는 것은?",
      options: ["산소 + 포도당", "이산화탄소 + 물", "질소 + 단백질", "산소 + 이산화탄소"],
      answer: 0,
      explanation: "식물은 빛 에너지를 이용해 이산화탄소와 물을 포도당과 산소로 바꿉니다."
    },
    {
      question: "다음 중 포유류가 아닌 것은?",
      options: ["고래", "박쥐", "펭귄", "코끼리"],
      answer: 2,
      explanation: "펭귄은 조류(새)이며, 고래·박쥐·코끼리는 모두 포유류입니다."
    },
    {
      question: "1년 동안 지구 주위를 한 바퀴 도는 것은?",
      options: ["달", "태양", "지구", "화성"],
      answer: 0,
      explanation: "달은 지구 주위를 약 27.3일에 한 바퀴 공전합니다."
    },
    {
      question: "인체에서 가장 큰 장기는?",
      options: ["간", "뇌", "피부", "심장"],
      answer: 2,
      explanation: "피부는 전체 체중의 약 16%를 차지하는 인체에서 가장 큰 장기입니다."
    },
    {
      question: "다음 중 대륙이 아닌 것은?",
      options: ["아시아", "유럽", "그린란드", "아프리카"],
      answer: 2,
      explanation: "그린란드는 대륙이 아닌 섬이며, 오세아니아의 일부로 분류됩니다."
    },
    {
      question: "한글은 언제 창제되었나요?",
      options: ["15세기", "17세기", "19세기", "20세기"],
      answer: 0,
      explanation: "한글은 조선 세종대왕 때인 1443년경 창제되어 1446년에 반포되었습니다(15세기)."
    },
    {
      question: "다음 중 프로그래밍 언어가 아닌 것은?",
      options: ["Python", "JavaScript", "HTML", "Java"],
      answer: 2,
      explanation: "HTML은 마크업 언어이며, Python·JavaScript·Java는 프로그래밍 언어입니다."
    },
    {
      question: "한국에 최초로 철도가 개통된 해는?",
      options: ["1899년", "1905년", "1910년", "1923년"],
      answer: 0,
      explanation: "한국 최초의 철도는 1899년 개통된 경인선(노량진~인천)입니다."
    }
  ];

  // ---- 등급 정의 ----
  const RANK_THRESHOLDS = [
    { rank: "브론즈", maxScore: 0 },
    { rank: "실버", maxScore: 5 },
    { rank: "골드", maxScore: 15 },
    { rank: "플래티넘", maxScore: 30 }
  ];

  function getRank(totalScore) {
    let rank = RANK_THRESHOLDS[0].rank;
    for (let i = RANK_THRESHOLDS.length - 1; i >= 0; i--) {
      if (totalScore >= RANK_THRESHOLDS[i].maxScore) {
        rank = RANK_THRESHOLDS[i].rank;
        break;
      }
    }
    return rank;
  }

  // ---- 저장소 ----
  const STORAGE_KEY = "quizrun_progress_v1";

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      // 날짜 변경 감지용
      return data;
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* 저장소 불가 시 조용히 넘어감 */ }
  }

  function getTodayIndex() {
    const now = new Date();
    // 연+월+일로 간단한 날짜 키 생성(시 reproducible)
    return now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
  }

  // ---- 상태 ----
  let state = loadProgress();
  const todayIdx = getTodayIndex();
  const isNewDay = !state || state.lastDate !== todayIdx;

  // 새 날이면 초기화
  if (isNewDay) {
    state = {
      lastDate: todayIdx,
      totalScore: 0,
      correctCount: 0,
      streak: 0,
      totalAttempts: 0,
      answeredToday: false,
      currentQuestionIdx: 0
    };
    saveProgress(state);
  }

  // 오늘 이미 풀었으면 새 문제 인덱스 계산
  if (state.answeredToday) {
    // 이전에 풀었던 문제 다음 인덱스
    state.currentQuestionIdx = (state._lastQIdx || 0) % questions.length;
  } else {
    state.currentQuestionIdx = 0;
  }

  function updateUI() {
    // stats
    document.getElementById("streakCount").textContent = state.streak;
    document.getElementById("rankBadge").textContent = getRank(state.totalScore);

    // 새 날 배너
    if (isNewDay) {
      document.getElementById("newDayBanner").classList.add("visible");
    }

    renderQuestion();
  }

  // ---- 문제 렌더링 ----
  function renderQuestion() {
    const q = questions[state.currentQuestionIdx];
    const num = String(state.currentQuestionIdx + 1).padStart(2, "0");

    document.getElementById("questionNumber").textContent = `QUESTION ${num}`;
    document.getElementById("questionText").textContent = q.question;

    const container = document.getElementById("optionsContainer");
    container.innerHTML = "";

    const letters = ["A", "B", "C", "D"];
    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.dataset.idx = idx;
      btn.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${opt}</span>`;
      btn.addEventListener("click", () => handleSelect(idx));
      container.appendChild(btn);
    });

    // 결과 영역 숨김
    document.getElementById("resultArea").classList.remove("visible");
  }

  function handleSelect(selectedIdx) {
    if (state.answeredToday) return; // 오늘 이미 풀었으면 더 풀지 못하게 (선택)

    const q = questions[state.currentQuestionIdx];
    const btns = document.querySelectorAll(".option-btn");

    // 정답 판별
    const isCorrect = (selectedIdx === q.answer);

    // 점수·스트릭 갱신
    if (isCorrect) {
      state.totalScore += 10;
      state.correctCount += 1;
      state.streak += 1;
    } else {
      state.streak = 0;
    }
    state.totalAttempts += 1;
    state.answeredToday = true;
    state._lastQIdx = state.currentQuestionIdx;

    saveProgress(state);

    // 버튼 비활성화 및 정답 표시
    btns.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.answer) btn.classList.add("correct");
      else if (idx === selectedIdx && !isCorrect) btn.classList.add("wrong");
      if (idx === selectedIdx) btn.classList.add("selected");
    });

    // 결과 영역 표시
    const resultIcon = document.getElementById("resultIcon");
    const resultText = document.getElementById("resultText");
    const explanationText = document.getElementById("explanationText");

    if (isCorrect) {
      resultIcon.className = "result-icon correct";
      resultIcon.textContent = "🎉";
      resultText.className = "result-text correct";
      resultText.textContent = "정답입니다! 🎉";
    } else {
      resultIcon.className = "result-icon wrong";
      resultIcon.textContent = "💦";
      resultText.className = "result-text wrong";
      resultText.textContent = "아쉽네요! 다음엔 맞혀 봐요.";
    }

    explanationText.textContent = q.explanation;

    // 다음 버튼 텍스트
    const nextBtn = document.getElementById("nextBtn");
    if (state.currentQuestionIdx >= questions.length - 1) {
      nextBtn.textContent = "처음부터 다시 풀기";
    } else {
      nextBtn.textContent = "다음 문제 풀기";
    }

    document.getElementById("resultArea").classList.add("visible");
    document.getElementById("streakBadge").textContent = "🔥 " + state.streak;
    document.getElementById("rankBadge").textContent = getRank(state.totalScore);
  }

  // ---- 버튼 ----
  document.getElementById("nextBtn").addEventListener("click", function() {
    // 다음 문제 인덱스
    state.currentQuestionIdx = (state.currentQuestionIdx + 1) % questions.length;
    state.answeredToday = false;
    saveProgress(state);
    renderQuestion();
  });

  document.getElementById("resetBtn").addEventListener("click", function() {
    if (confirm("기록을 모두 초기화하고 새로 시작하시겠습니까?")) {
      state = {
        lastDate: todayIdx,
        totalScore: 0,
        correctCount: 0,
        streak: 0,
        totalAttempts: 0,
        answeredToday: false,
        currentQuestionIdx: 0,
        _lastQIdx: 0
      };
      saveProgress(state);
      updateUI();
    }
  });

  // ---- 초기 실행 ----
  updateUI();
})();
</script>
</body>
</html>
